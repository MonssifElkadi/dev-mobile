<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Breeds</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 16px;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }

      #images {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }

      #images img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border: 1px solid #111;
      }
    </style>
  </head>
  <body>
    <h3>Dog Breeds</h3>
    <div class="controls">
      <input id="search" type="text" placeholder="Rechercher une race..." />
      <select id="breeds"></select>
    </div>
    <div id="images"></div>
    <script src="EX2.js"></script>
  </body>
</html>
